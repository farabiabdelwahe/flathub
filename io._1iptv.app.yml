app-id: io._1iptv.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: 1iptv
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-download

modules:
  - name: 1iptv
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main
      - cp -r * /app/main/
      - install -Dm755 1iptv-wrapper.sh /app/bin/1iptv
      - install -Dm644 io._1iptv.app.desktop /app/share/applications/io._1iptv.app.desktop
      - install -Dm644 io._1iptv.app.metainfo.xml /app/share/metainfo/io._1iptv.app.metainfo.xml
      - install -Dm644 io._1iptv.app.png /app/share/icons/hicolor/512x512/apps/io._1iptv.app.png
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/oussa005/1IPTV-React/releases/download/v1.0.11/1IPTV-1.0.11-linux-x64.tar.gz
        sha256: c517a174e7b2b41145043087463fcb17285ef78f84c12e3f8a7d3988ba29bca3
      - type: script
        dest-filename: 1iptv-wrapper.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/main/1iptv "$@"
      - type: file
        path: io._1iptv.app.desktop
      - type: file
        path: io._1iptv.app.metainfo.xml
      - type: file
        path: io._1iptv.app.png
